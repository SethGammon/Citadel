name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@d777b580805f6fadb19a03f84daf0974c53c6d38 # v1
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          output: ${{ github.workspace }}/plugin-scanner.sarif
          upload_sarif: true
      - name: Summarize scanner finding coordinates
        if: failure()
        run: node scripts/sarif-coordinates.js plugin-scanner.sarif
      - name: Upload failed scanner report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hol-plugin-scanner-sarif
          path: plugin-scanner.sarif
          if-no-files-found: error
          retention-days: 7
